<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Contact | Hwijin Baldick</title>

<link rel="stylesheet" href="styles.css" />

<style>
  .contact-page {
    padding: 64px 0 80px;
    border-bottom: 0;
  }

  .contact-content {
    max-width: 760px;
  }

  .contact-content h1 {
    margin: 0 0 32px;
    font-size: clamp(34px, 5vw, 48px);
    letter-spacing: -0.025em;
  }

  .contact-links {
    width: 100%;
  }

  .contact-row {
    display: grid;
    grid-template-columns: 160px minmax(0, 1fr);
    gap: 28px;
    padding: 18px 0;
    border-bottom: 1px solid #e8e8e8;
  }

  .contact-row:first-child {
    border-top: 1px solid #e8e8e8;
  }

  .contact-label {
    color: #222222;
    font-weight: 650;
  }

  .contact-row a {
    color: #249cc5;
    text-decoration: none;
  }

  .contact-row a:hover {
    text-decoration: underline;
  }

  @media (max-width: 640px) {
    .contact-page {
      padding-top: 42px;
    }

    .contact-row {
      grid-template-columns: 1fr;
      gap: 4px;
      padding: 16px 0;
    }
  }
</style>

</head>
